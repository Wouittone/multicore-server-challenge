name: Pony Hobby push checks
on:
  push:
    paths:
      - submissions/pony-hobby-wouittone/**
      - .github/workflows/pony-hobby-push.yml
permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and run all Pony unit tests
        shell: pwsh
        run: ./submissions/pony-hobby-wouittone/build.ps1

  conformance:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 2s --health-timeout 5s --health-retries 30
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: bench/go.mod
          cache-dependency-path: bench/go.sum
      - name: Install test tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client curl jq
      - name: Seed PostgreSQL
        run: bash seed/make-seed.sh --dev
      - name: Install Pony toolchain and C libraries
        run: sudo bash submissions/pony-hobby-wouittone/install.sh
      - name: Build, start, and run full conformance
        run: bash test/run.sh submissions/pony-hobby-wouittone
